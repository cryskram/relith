version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - builtinShadow
        - deferInLoop
        - emptyStringTest
        - equalFold
        - evalOrder
        - httpNoBody
        - importShadow
        - initClause
        - methodExprCall
        - nestingReduce
        - nilValReturn
        - ptrToRefParam
        - sloppyReassign
        - stringConcatSimplify
        - timeExprSimplify
        - todoCommentWithoutDetail
        - typeUnparen
        - unlabelStmt
        - weakCond
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - revive
        path: internal/db/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
